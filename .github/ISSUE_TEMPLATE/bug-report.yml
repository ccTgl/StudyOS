name: Bug report
description: Report a reproducible StudyOS beta issue
title: "[Bug] "
body:
  - type: input
    id: environment
    attributes:
      label: StudyOS version and Windows build
      placeholder: "StudyOS 1.2.1, Windows x64 build …"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a synthetic example. GitHub Issues is public. Omit real notes, PDFs, paths, workspace archives, personal information, and OAuth credentials.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
